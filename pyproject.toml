[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyview"
version = "0.1.0"
description = "A Python library for multi-view learning: fusion, clustering and embedding."
readme = "README.md"
authors = [
    { name = "Gwendal Debaussart-Joniec", email = "gwendal.debaussart@ens.paris-saclay.fr" }
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
# Pipeline diagrams (PolyPipeline.draw)
viz = ["matplotlib", "networkx"]
test = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]

[project.urls]
Repository = "https://github.com/Gwendal-Debaussart/polyview"